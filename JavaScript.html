<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    Nama: <i id="value_nama"></i>
    <br>
    Umur: <i id="value_umur"></i> Tahun

    <script>
        //String Variable
        var nama = "Arya";

        let umur = 19;

        let tinggi = 169;

        //Array
        let Filmfavorit = ["Naruto", "Dragonball", "Bleach"];

        //Menampilkan jendela konsol
        console.log("Nama: "+ nama);
        console.log("Umur: "+ umur);
        console.log("Tinggi: "+ tinggi + " cm");
        console.log(Filmfavorit[0]);

        //Arithmatic Operation
        let a = 17;
        let b = 6.9;

        let jumlah = a + b;
        console.log("Hasil penjumlahan a & b: " + jumlah)

        let kurang = a - b;
        console.log("Hasil pengurangan a & b: " + kurang)

        let kali = a * b;
        console.log("Hasil perkalian a & b: " + kali)

        let bagi = a / b;
        console.log("Hasil pembagian a & b: " + bagi)

        let sisa = a % b;
        console.log("Hasil sisa a & b: " + sisa)

        let pangkat = a * b;
        console.log("Hasil perpangkatan a & b: " + pangkat)

        //Conditional Statement
        let nilai = 85;

        if (nilai >= 90) {
            console.log("Nilai: A");
        } else if (nilai >= 80) {
            console.log("Nilai: B")
        } else if (nilai >= 70) {
            console.log("Nilai: C")
        } else if (nilai >= 60) {
            console.log("Nilai: D")
        } else {
            consol.log("Nilai: E")
        }

        //Looping
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        //Function
        function penjumlahan(a, b) {
            return console.log("Hasil penjumlahan: " + (a + b));
        }

        penjumlahan(10, 5);


        //Menampilakn nama ke halaman web (DOM)
        document.getElementById("value_nama").innerHTML = nama;
        document.getElementById("value_umur").innerHTML = umur;
    </script>

</body>
</html>
